    <script>
        // Initialize ScrollReveal
        if (window.ScrollReveal) {
            ScrollReveal().reveal('section', { distance: '50px', duration: 800, easing: 'ease-in-out', origin: 'bottom', interval: 100 });
        }

        const menuBtn = document.getElementById('menu-btn');
        const menu = document.getElementById('menu');
        if (menuBtn && menu) {
            menuBtn.addEventListener('click', () => { menu.classList.toggle('hidden'); menu.classList.toggle('flex'); });
        }

        (function () {
            const track = document.getElementById('portrait-track');
            const prevBtn = document.getElementById('portrait-prev');
            const nextBtn = document.getElementById('portrait-next');
            if (!track) return;

            let cards = Array.from(track.querySelectorAll('.flex-shrink-0'));
            const AUTO_INTERVAL = 3000; // ms
            let autoTimer = null;
            let isHovering = false;

            function scrollByCard(offsetMultiplier = 1) {
                cards = Array.from(track.querySelectorAll('.flex-shrink-0'));
                if (!cards.length) return;
                const card = cards[0];
                const gap = 16; // tailwind gap-4 default
                const cardWidth = card.getBoundingClientRect().width;
                const amount = (cardWidth + gap) * offsetMultiplier;
                track.scrollBy({ left: amount, behavior: 'smooth' });
            }

            if (prevBtn) prevBtn.addEventListener('click', () => { scrollByCard(-1); resetAuto(); });
            if (nextBtn) nextBtn.addEventListener('click', () => { scrollByCard(1); resetAuto(); });

            function startAuto() {
                if (autoTimer) clearInterval(autoTimer);
                autoTimer = setInterval(() => {
                    if (isHovering) return;
                    const maxScroll = track.scrollWidth - track.clientWidth;
                    if (track.scrollLeft >= maxScroll - 10) {
                        track.scrollTo({ left: 0, behavior: 'smooth' });
                    } else {
                        scrollByCard(1);
                    }
                }, AUTO_INTERVAL);
            }

            function stopAuto() { if (autoTimer) { clearInterval(autoTimer); autoTimer = null; } }
            function resetAuto() { stopAuto(); startAuto(); }

            track.addEventListener('mouseenter', () => { isHovering = true; });
            track.addEventListener('mouseleave', () => { isHovering = false; });
            track.addEventListener('focusin', () => { isHovering = true; });
            track.addEventListener('focusout', () => { isHovering = false; });

            track.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') { scrollByCard(-1); resetAuto(); } if (e.key === 'ArrowRight') { scrollByCard(1); resetAuto(); } });

            startAuto();

            let userScrollTimeout;
            track.addEventListener('scroll', () => { clearTimeout(userScrollTimeout); userScrollTimeout = setTimeout(resetAuto, 1000); });

            track.tabIndex = 0;
        })();

            track.addEventListener('mouseleave', () => { isHovering = false; });
            track.addEventListener('focusin', () => { isHovering = true; });
            track.addEventListener('focusout', () => { isHovering = false; });
